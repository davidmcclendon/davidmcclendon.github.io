<style>
#viz-tip {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity .09s ease-out;
  max-width: 19rem;
  padding: .4rem .55rem;
  border-radius: 4px;
  font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: .8rem;
  line-height: 1.35;
  background: #22262b;
  color: #fdfcfa;
  box-shadow: 0 2px 10px rgba(0,0,0,.22);
}
#viz-tip[data-show="1"] { opacity: 1; }
:root[data-theme="dark"] #viz-tip { background: #e4e1dc; color: #16181c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #viz-tip { background: #e4e1dc; color: #16181c; }
}
</style>
<script>
(function () {
  // Native SVG <title> tooltips are slow, unstyleable, absent on touch, and
  // suppressed inside role="img" subtrees in some browsers. Lift the text onto
  // a data attribute, drop the <title>, and render our own. No dependencies.
  function init() {
    var pts = document.querySelectorAll(".viz-pt");
    if (!pts.length) return;

    var tip = document.createElement("div");
    tip.id = "viz-tip";
    document.body.appendChild(tip);

    var shown = false;
    function hide() { if (shown) { tip.removeAttribute("data-show"); shown = false; } }
    function place(e) {
      var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
      var x = e.clientX + pad, y = e.clientY + pad;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tip.style.left = Math.max(8, x) + "px";
      tip.style.top = Math.max(8, y) + "px";
    }

    pts.forEach(function (g) {
      var t = g.querySelector("title");
      if (!t) return;
      var text = t.textContent.trim();
      if (!text) return;
      g.setAttribute("data-tip", text);
      t.parentNode.removeChild(t);   // otherwise both tooltips fire

      g.addEventListener("pointerenter", function (e) {
        tip.textContent = text;
        tip.setAttribute("data-show", "1");
        shown = true;
        place(e);
      });
      g.addEventListener("pointermove", function (e) { if (shown) place(e); });
      g.addEventListener("pointerleave", hide);
    });

    window.addEventListener("scroll", hide, { passive: true });
    window.addEventListener("blur", hide);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }
})();
</script>

<script>
(function () {
  // Open outbound links in a new tab.
  //
  // Quarto's `link-external-newwindow: true` is set in _quarto.yml but has no
  // effect in the bundled version here, and it would not reach links emitted
  // inside raw-HTML blocks or the EJS listing templates anyway. Doing it in the
  // DOM covers every link on the page from one place.
  //
  // rel="noopener noreferrer" is required with target="_blank": without it the
  // opened page gets a handle on this one via window.opener.
  function init() {
    var here = location.hostname;
    var links = document.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var href = a.getAttribute('href') || '';
      if (!/^https?:/i.test(href)) continue;      // skip #anchors, mailto:, relative paths
      var host;
      try { host = new URL(a.href).hostname; } catch (e) { continue; }
      if (!host || host === here) continue;        // keep same-site navigation in this tab
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
