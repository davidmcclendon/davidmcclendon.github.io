# Coverage that names or quotes me. NEWEST FIRST; the page uses sort: false,
# so file order is page order.
#
# Required: title, outlet, url
# Optional: date, archived, format (e.g. "video" for a broadcast segment)
#
# No blurbs here on purpose. Listing the outlet, headline and date is enough;
# describing what each piece said about the work reads as self-promotional.
#
# Inclusion rule: only items where I am named, or where the piece links to
# our analysis. Pieces that cite the underlying research without naming
# anyone are covered by the note at the bottom of press.qmd instead.
#
# Items that also appear as `coverage:` entries under a piece in
# data/writing.yml are intentionally listed in both places.

