- title: "When Real Debt Collection Lawsuits Look Like Scams: The Problem with Pocket Filing in Minnesota"
  outlet: "January Advisors"
  date: 2026-04-01
  url: "https://www.januaryadvisors.com/debt-collection-pocket-filing-in-minnesota/"
  blurb: "Minnesota lets a debt collector serve a lawsuit up to a year before filing it with the court, so defendants cannot confirm the case is real. A review of 1,000 cases found most plaintiffs file within two months anyway."

- title: "43 states have online voter registration. Why not Texas?"
  outlet: "January Advisors"
  date: 2026-03-24
  coauthors: "Shannon Carter"
  url: "https://www.januaryadvisors.com/texas-online-voter-registration/"
  blurb: "Florida registration data from 2017 to 2024 shows no independent partisan effect from online registration. County population size drove the trends instead."

- title: "Most people sued for debt never get their day in court. We can fix that."
  outlet: "January Advisors"
  date: 2025-12-19
  url: "https://www.januaryadvisors.com/debt-collection-answer-requirement/"
  blurb: "People sued for debt are 2.1 to 3.7 times more likely to take part in their case where courts require no formal written answer. Dropping California's answer requirement could bring 5,000 to 12,000 more defendants into the process each year."
  coverage:
    - outlet: "Journalist's Resource"
      url: "https://journalistsresource.org/economics/debt-collection-lawsuits/"


- title: "Consumer Debt Collection Lawsuits in Wisconsin, 2018-2024"
  outlet: "Debt Collection Lab"
  date: 2025-12-17
  coauthors: "Divia Kallattil"
  url: "https://debtcollectionlab.org/research/wisconsin-debt-collection-lawsuits/"
  blurb: "Wisconsin courts saw nearly 100,000 debt collection filings in 2024, most brought by national debt buyers and banks. Black residents were sued at 1.86 times the rate of white residents."

- title: "Could stronger wage garnishment protections mean fewer debt collection lawsuits?"
  outlet: "January Advisors"
  date: 2025-12-16
  url: "https://www.januaryadvisors.com/wage-garnishment-protections-debt-collection-lawsuits/"
  blurb: "States with stronger wage garnishment protections see fewer debt collection filings per capita. Raising the nine states graded F to a C could mean roughly 128,000 fewer cases a year."

- title: "Consumer Debt Cases Are Surging Again—and One Company Is Leading the Charge"
  outlet: "January Advisors"
  date: 2025-08-29
  coauthors: "Divia Kallattil"
  url: "https://www.januaryadvisors.com/consumer-debt-cases-are-surging-again-2024/"
  blurb: "Debt collection filings matched or passed pre-pandemic levels in 2024 and 2025. LVNV Funding's volume rose 350% since 2019 and now makes up 18% of all filings in the sample."
