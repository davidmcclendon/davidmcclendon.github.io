  date: 2025-03-19
  coauthors: "Brian Barr, Jeff Reichman"
  url: "https://www.januaryadvisors.com/how-campaign-donations-affect-indigent-defense-in-harris-county/"
  blurb: "Harris County judges assigned about twice as many indigent defense cases to attorneys who donated to their campaigns. Donor attorneys got no better outcomes than non-donors, and public defenders outperformed appointed counsel."

- title: "Measuring racial disparities in consumer debt lawsuits"
  outlet: "January Advisors"
  date: 2024-08-26
  url: "https://www.januaryadvisors.com/debt-racial-disparities/"
  blurb: "In Michigan, Minnesota, and Oregon, Black and Latino residents faced debt collection lawsuits at two to three times the rate of non-Hispanic white residents. The gap held in higher-income neighborhoods."

- title: "Third-party debt collectors and debt buyers dominate Oregon's civil courts, few Oregonians participate in debt cases against them"
  outlet: "Debt Collection Lab"
  date: 2024-08-19
  coauthors: "Divia Kallattil"
  url: "https://debtcollectionlab.org/research/oregon-findings-chartbook/"
  blurb: "Debt collection cases made up 52% of Oregon's circuit court civil docket and reached more than 50,000 residents a year. Fewer than 4% of defendants responded and fewer than 1% had a lawyer."

