- title: "Consumer Debt Filings Kept Climbing in 2025"
  outlet: "January Advisors"
  date: 2026-07-15
  coauthors: "Divia Kallattil"
  url: "https://www.januaryadvisors.com/consumer-debt-filings-kept-climbing-in-2025/"
  blurb: "Debt collection filings rose again in 2025. Missouri reached 188% and Texas 177% of their 2019 volumes, and the debt buyer LVNV Funding alone accounted for about 23% of cases in the sample."
  coverage:
    - outlet: "Wall Street Journal"
      url: "https://www.wsj.com/personal-finance/credit/debt-collectors-chase-more-consumers-in-court-f8d0ed3f"
    - outlet: "Bloomberg Law"
